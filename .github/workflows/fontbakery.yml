name: Fontbakery
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fontbakery[googlefonts]"
      - run: fontbakery check-googlefonts -l WARN --succinct --ghmarkdown report.md fonts/otf/Kuhmard-Bold.otf
      - if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
